name: Release

# Dựng Alice cho cả ba hệ điều hành rồi đăng lên Releases.
#
# Vì sao phải qua CI: `.dmg` chỉ dựng được trên macOS, `.AppImage` chỉ dựng được
# trên Linux — không cross-build từ Windows. Ba runner của GitHub giải đúng chỗ đó.
#
# Chạy khi đẩy một tag `v*`:
#   git tag v0.1.0 && git push origin v0.1.0
# Hoặc bấm tay ở tab Actions.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Số phiên bản (vd 0.1.0). Bỏ trống thì lấy từ package.json.'
        required: false

permissions:
  contents: write   # cần để tạo release và upload file

jobs:
  build:
    strategy:
      fail-fast: false   # macOS hỏng thì Windows vẫn ra file, còn hơn không có gì
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux

    runs-on: ${{ matrix.os }}
    name: Dựng ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 KHÔNG build được: electron-builder 26 kéo @noble/hashes v2 vốn
          # ESM-only và ném ERR_REQUIRE_ESM. Cũng là bản mà `node:sqlite` cần.
          node-version: 22
          cache: npm

      # Electron binary tải từ GitHub releases; runner đôi khi dính 503/hang mạng
      # (đã gặp nhiều lần). npm retry không phủ postinstall (electron zip tải bằng
      # got) — nên bọc cả lệnh bằng vòng retry thật.
      - name: npm ci (có retry)
        shell: bash
        run: |
          for i in 1 2 3 4; do
            if npm ci --fetch-retries=6 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000; then
              break
            fi
            echo "npm ci lần $i hỏng — chờ 20s thử lại…"
            sleep 20
          done

      # Nhúng binary opencode. CI không có sẵn nên tải từ npm rồi trỏ script vào.
      - name: Nhúng opencode
        shell: bash
        run: |
          npm i --no-save opencode-ai
          # Gói opencode-ai luôn đặt binary ở bin/opencode.exe, TRÊN CẢ Linux/macOS —
          # ".exe" chỉ là tên file cố định của gói, nội dung thật đã được optionalDependencies
          # (opencode-linux-x64, opencode-darwin-arm64, ...) chọn đúng theo OS/CPU lúc `npm i`.
          SRC="node_modules/opencode-ai/bin/opencode.exe"
          test -f "$SRC" || { echo "Không thấy binary opencode ở $SRC"; ls -R node_modules/opencode-ai/bin || true; exit 1; }
          mkdir -p runtime/opencode
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$SRC" runtime/opencode/opencode.exe
          else
            cp "$SRC" runtime/opencode/opencode
          fi
          chmod +x runtime/opencode/* || true

      # Nhúng phần CHẠY của brain (Python + thư viện), KHÔNG nhúng tri thức — brain
      # rỗng tự dựng ở lần chạy đầu. Feedback khách 2026-08-12: bản phát cho khách
      # phải có sẵn recall, không phải bản "chat mà không tra được tri thức".
      # `bundle-brain.ps1 -Source vendor` lấy nguồn từ `brain-source/` ngay trong
      # repo (alice-brain/alice-core là private nên không clone được từ CI public;
      # sync bằng `npm run brain:sync-source` trước mỗi release).
      - name: Nhúng brain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bundle-brain.ps1 -Source vendor

      # macOS/Linux: pwsh có sẵn trên runner; python3.12 do setup-python cung cấp —
      # script copy nguyên cây python vào runtime rồi cài wheel đúng hệ điều hành.
      - name: Nhúng brain (macOS / Linux)
        if: runner.os != 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Nhúng brain (macOS / Linux — bundle)
        if: runner.os != 'Windows'
        shell: pwsh
        run: ./scripts/bundle-brain.ps1 -Source vendor

      - name: Kiểm bộ cài không lẫn tri thức của ai
        shell: bash
        run: |
          for d in runtime/brain-seed alice-data; do
            if [ -e "$d" ]; then echo "LỖI: $d không được có mặt lúc đóng gói"; exit 1; fi
          done
          # Brain thật sự nằm trong bộ cài — kiểm import trong runtime vừa dựng.
          test -d runtime/brain/app/sag_api || { echo "LỖI: thiếu runtime/brain/app/sag_api"; exit 1; }
          test -d runtime/brain/app/alicecore || { echo "LỖI: thiếu runtime/brain/app/alicecore"; exit 1; }
          echo "sạch và đủ"

      - name: Test
        shell: bash
        # Bỏ e2e: nó gọi model thật, cần API key mà CI không có.
        run: ALICE_SKIP_E2E=1 node --test test/memory.test.js test/workspace.test.js

      - name: Đóng gói (có retry)
        shell: bash
        run: |
          for i in 1 2 3 4; do
            if npx electron-builder --publish never; then
              break
            fi
            echo "electron-builder lần $i hỏng — chờ 20s thử lại…"
            sleep 20
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: alice-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    name: Đăng lên Releases
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true
          body: |
            ## Cài Alice

            **Windows** — dán vào Command Prompt hoặc PowerShell:

            ```
            powershell -NoProfile -Command "irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex"
            ```

            **macOS / Ubuntu** — dán vào Terminal:

            ```
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            Hoặc tải thẳng file hợp với máy bạn ở dưới.

            Lần đầu mở, Alice xin một API key — làm theo màn hình là xong.
