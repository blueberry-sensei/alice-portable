<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat với Alice</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(180deg, #10172e 0%, #0a1022 60%, #070b18 100%);
    color: #e9effa; height:100vh; display:flex; flex-direction:column;
  }
  .head {
    padding:14px 18px; border-bottom:1px solid #233048;
    display:flex; align-items:center; gap:12px; background:rgba(16,23,46,.9);
  }
  .ava {
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(160deg, #c9afff, #7ec8ff);
    display:flex; align-items:center; justify-content:center;
    font-weight:900; color:#1e0a45; font-size:16px;
  }
  .who .name { font-weight:800; font-size:16px; }
  .who .sub { font-size:11.5px; color:#6b7a99; }
  .feed {
    flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px;
  }
  .row { display:flex; gap:10px; align-items:flex-end; }
  .row.mine { justify-content:flex-end; }
  .bubble {
    max-width:78%; padding:10px 14px; border-radius:14px 14px 14px 4px;
    background:#141b2d; border:1px solid #233048; font-size:14px; line-height:1.55;
    white-space:pre-wrap; overflow-wrap:anywhere;
  }
  .row.mine .bubble { border-radius:14px 14px 4px 14px; background:linear-gradient(160deg,#c9afff,#7a45e8); color:#1e0a45; }
  .compose {
    padding:12px 16px 14px; border-top:1px solid #233048;
    display:flex; gap:10px; align-items:flex-end; background:rgba(16,23,46,.9);
  }
  input {
    flex:1; padding:11px 14px; border-radius:20px; border:1px solid #233048;
    background:#0d1424; color:#e9effa; font-size:14px; outline:none;
  }
  input:focus { border-color:#9b6bff; }
  button {
    padding:11px 18px; border:none; border-radius:20px; cursor:pointer;
    background:linear-gradient(160deg,#c9afff,#7a45e8); color:#1e0a45;
    font-weight:800; font-size:14px;
  }
  button:hover { transform:translateY(-1px); }
  .login {
    flex:1; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .login .card {
    width:100%; max-width:340px; padding:22px; border-radius:16px;
    background:#141b2d; border:1px solid #233048;
    display:flex; flex-direction:column; gap:12px;
  }
  .login .card h2 { font-size:18px; margin-bottom:4px; }
  .login .err { color:#ff8a80; font-size:12.5px; min-height:16px; }
  .typing { color:#6b7a99; font-size:12px; padding:2px 0; }
</style>
</head>
<body>
  <div class="head">
    <div class="ava">★</div>
    <div class="who">
      <div class="name" id="alice-name">Alice</div>
      <div class="sub" id="alice-sub">đang kết nối…</div>
    </div>
  </div>

  <div id="login-view" class="login" hidden>
    <div class="card">
      <h2>Đăng nhập</h2>
      <input id="lg-user" type="text" placeholder="Tên đăng nhập" autocomplete="username">
      <input id="lg-pass" type="password" placeholder="Mật khẩu" autocomplete="current-password">
      <div class="err" id="lg-err"></div>
      <button id="lg-btn">Vào chat</button>
    </div>
  </div>

  <div id="chat-view" class="feed" hidden></div>

  <div id="compose" class="compose" hidden>
    <input id="msg" placeholder="Nhắn cho Alice…" autocomplete="off">
    <button id="send">Gửi</button>
  </div>

<script>
const MODE = '__MODE__'; // 'anyone' | 'account' — server chèn lúc phục vụ
const API = '';
let token = localStorage.getItem('alice-token') || null;

const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function init() {
  try {
    const r = await fetch(API + '/v1/who');
    const d = await r.json();
    $('alice-name').textContent = d.name;
    $('alice-sub').textContent = MODE === 'account' ? 'cần đăng nhập để chat' : 'chào bạn — cứ hỏi tự nhiên';
  } catch { /* máy chủ vẫn hoạt động, chỉ chưa lấy được tên */ }

  if (MODE === 'anyone') {
    showChat();
  } else {
    // Account mode: nếu đã có session token hợp lệ thì vào thẳng.
    if (token) {
      const ok = await fetch(API + '/v1/check', { headers: { Authorization: 'Bearer ' + token } });
      if (ok.ok) { showChat(); return; }
    }
    $('login-view').hidden = false;
    $('lg-btn').onclick = login;
    $('lg-pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
    $('lg-user').focus();
  }
}

async function login() {
  $('lg-err').textContent = '';
  try {
    const r = await fetch(API + '/v1/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('lg-user').value, password: $('lg-pass').value }),
    });
    const d = await r.json();
    if (!r.ok) { $('lg-err').textContent = d.error || 'Sai tên hoặc mật khẩu.'; return; }
    token = d.token;
    localStorage.setItem('alice-token', token);
    showChat();
  } catch {
    $('lg-err').textContent = 'Không kết nối được máy chủ.';
  }
}

function showChat() {
  $('login-view').hidden = true;
  $('chat-view').hidden = false;
  $('compose').hidden = false;
  $('alice-sub').textContent = 'Alice luôn nhớ cuộc trò chuyện này';
  addMsg('alice', 'Chào bạn, mình có thể giúp gì?');
  $('msg').focus();
}

function addMsg(who, text) {
  const row = document.createElement('div');
  row.className = 'row' + (who === 'me' ? ' mine' : '');
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(b);
  $('chat-view').appendChild(row);
  $('chat-view').scrollTop = $('chat-view').scrollHeight;
}

let busy = false;
async function send() {
  const text = $('msg').value.trim();
  if (!text || busy) return;
  $('msg').value = '';
  addMsg('me', text);
  busy = true;
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.textContent = 'Alice đang trả lời…';
  $('chat-view').appendChild(typing);
  $('chat-view').scrollTop = $('chat-view').scrollHeight;
  try {
    const r = await fetch(API + '/v1/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: token ? 'Bearer ' + token : '' },
      body: JSON.stringify({ message: text }),
    });
    const d = await r.json();
    typing.remove();
    if (!r.ok) {
      addMsg('alice', 'Có lỗi: ' + (d.error || 'không rõ'));
      if (r.status === 401) { token = null; localStorage.removeItem('alice-token'); }
      return;
    }
    addMsg('alice', d.text);
  } catch {
    typing.remove();
    addMsg('alice', 'Không kết nối được máy chủ.');
  } finally {
    busy = false;
    $('msg').focus();
  }
}

$('send').onclick = send;
$('msg').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

init();
</script>
</body>
</html>
