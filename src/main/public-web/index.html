<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!--
  `maximum-scale=1, user-scalable=no`: iOS Safari phóng to trang mỗi lần chạm vào ô
  nhập nếu font < 16px, rồi KHÔNG thu lại — trang lệch hẳn và người dùng phải tự
  pinch về. Khoá zoom là một nửa; nửa còn lại là mọi ô nhập để đúng 16px (xem
  `input, textarea` bên dưới). Thiếu một trong hai là vẫn nhảy.
  `viewport-fit=cover`: iPhone tai thỏ — cần để `env(safe-area-inset-*)` có giá trị.
-->
<!--
  `interactive-widget=resizes-content`: Android Chrome mặc định để bàn phím ĐÈ lên
  trang thay vì thu nhỏ trang lại, nên ô nhập nằm dưới bàn phím. Cờ này bảo nó thu
  khung nhìn — iOS không hiểu cờ này, phần đó xử bằng visualViewport ở cuối trang.
-->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0a1022">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<title>Chat với Alice</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  /* `display` do class đặt THẮNG `display:none` mà trình duyệt gán cho [hidden] —
     nên một khối `display:flex` vẫn hiện nguyên dù đang mang thuộc tính hidden.
     Đúng lỗi đã dính: mode "ai có link cũng vào được" mà điện thoại vẫn thấy màn
     đăng nhập, vì `.login` đặt `display:flex`. Luật này phải nằm TRƯỚC mọi class. */
  [hidden] { display: none !important; }

  :root {
    --bg-1:#10172e; --bg-2:#0a1022; --bg-3:#070b18;
    --surface:#141b2d; --border:#233048; --border-2:#2f3e5c;
    --text:#e9effa; --muted:#8496b8; --primary:#9b6bff;
    --primary-soft:#c9afff; --primary-deep:#7a45e8; --on-primary:#1e0a45;
    --danger:#ff8a80;
    /* Chiều cao thật của khung nhìn. `100vh` trên mobile tính CẢ thanh địa chỉ,
       nên ô nhập bị đẩy xuống dưới mép màn hình. `dvh` mới là phần nhìn thấy. */
    --vh: 100vh;
  }
  @supports (height: 100dvh) { :root { --vh: 100dvh; } }

  html { -webkit-text-size-adjust: 100%; height: 100%; overflow: hidden; }
  /*
    Khung app NEO vào khung nhìn nhìn-thấy-được, không neo vào trang.
    iOS mở bàn phím thì nó KHÔNG thu trang lại mà cuộn "khung nhìn thị giác" xuống;
    một body cao bằng `visualViewport.height` nhưng vẫn nằm ở đỉnh trang sẽ đặt ô
    nhập ở lưng chừng, cách bàn phím một khoảng lớn — đúng lỗi "chatbar bị đẩy lên
    siêu cao, sát head". `position:fixed` + dịch theo `offsetTop` mới dán được nó
    vào đúng vùng đang nhìn thấy.
  */
  body {
    position: fixed; top: 0; left: 0; right: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
    background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 60%, var(--bg-3) 100%);
    color: var(--text);
    height: var(--vh);
    display: flex; flex-direction: column;
    overscroll-behavior: none;           /* kéo quá đà không làm trang nảy */
  }

  /* ── đầu trang ─────────────────────────────────────────────────────────── */
  .head {
    flex-shrink: 0;
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    padding-left: calc(16px + env(safe-area-inset-left));
    padding-right: calc(16px + env(safe-area-inset-right));
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    background: rgba(16,23,46,.92);
    backdrop-filter: blur(14px);
  }
  .ava {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
    background: linear-gradient(160deg, var(--primary-soft), #7ec8ff);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; color: var(--on-primary); font-size: 15px;
  }
  .ava img { width: 100%; height: 100%; object-fit: cover; }
  .who { min-width: 0; flex: 1; }
  .who .name {
    font-weight: 800; font-size: 16px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .who .sub {
    font-size: 11.5px; color: var(--muted); margin-top: 1px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ── dòng tin ──────────────────────────────────────────────────────────── */
  .feed {
    flex: 1; min-height: 0; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px;
    padding-left: calc(16px + env(safe-area-inset-left));
    padding-right: calc(16px + env(safe-area-inset-right));
    display: flex; flex-direction: column; gap: 10px;
  }
  .row { display: flex; flex-direction: column; align-items: flex-start; }
  .row.mine { align-items: flex-end; }
  /* Tên người gửi — chỉ hiện cho tin của NGƯỜI KHÁC. Nhiều người chung một Alice
     mà không có tên thì đọc lại lịch sử không biết câu nào của ai. */
  .author {
    font-size: 11px; color: var(--muted); font-weight: 700;
    margin: 0 0 3px 13px; letter-spacing: .01em;
  }
  .bubble {
    max-width: 85%;
    padding: 10px 14px; border-radius: 16px 16px 16px 5px;
    background: var(--surface); border: 1px solid var(--border);
    font-size: 15px; line-height: 1.55;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .row.mine .bubble {
    border-radius: 16px 16px 5px 16px; border: none;
    background: linear-gradient(160deg, var(--primary-soft), var(--primary-deep));
    color: var(--on-primary); font-weight: 600;
  }
  /* Tin của người khác cũng nằm bên trái như Alice — cần một dấu hiệu để không
     đọc nhầm lời của khách thành lời của Alice. */
  .row.other .bubble { background: #1b2440; border-color: var(--border-2); }
  .bubble.err { border-color: #5c2b2e; background: #2a1215; color: var(--danger); }
  .typing { color: var(--muted); font-size: 12.5px; padding: 4px 2px; }

  /* ── ô nhập ────────────────────────────────────────────────────────────── */
  .compose {
    flex-shrink: 0;
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
    padding-left: calc(12px + env(safe-area-inset-left));
    padding-right: calc(12px + env(safe-area-inset-right));
    border-top: 1px solid var(--border);
    display: flex; gap: 9px; align-items: flex-end;
    background: rgba(16,23,46,.95);
    backdrop-filter: blur(14px);
  }
  .compose textarea {
    flex: 1; min-width: 0; resize: none;
    max-height: 120px; line-height: 1.4;
    padding: 11px 15px; border-radius: 20px;
    border: 1px solid var(--border); background: #0d1424; color: var(--text);
    font-family: inherit; outline: none;
  }
  .compose textarea:focus { border-color: var(--primary); }

  /* ── đăng nhập / mã truy cập ───────────────────────────────────────────── */
  .gate {
    flex: 1; min-height: 0; overflow-y: auto;
    display: flex; align-items: center; justify-content: center;
    padding: 24px calc(20px + env(safe-area-inset-left)) 24px calc(20px + env(safe-area-inset-right));
  }
  .gate .card {
    width: 100%; max-width: 360px; padding: 22px;
    border-radius: 18px; background: var(--surface); border: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 12px;
  }
  .gate h2 { font-size: 19px; }
  .gate .lead { font-size: 13px; color: var(--muted); line-height: 1.5; margin-top: -4px; }
  .gate .err { color: var(--danger); font-size: 12.5px; min-height: 16px; line-height: 1.4; }
  .code-input { letter-spacing: .38em; text-align: center; font-weight: 700; }

  /* 16px là ngưỡng iOS: nhỏ hơn là Safari tự phóng trang lúc chạm vào ô nhập. */
  input, textarea, button, select { font-size: 16px; font-family: inherit; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--border); background: #0d1424; color: var(--text);
    outline: none;
  }
  input:focus { border-color: var(--primary); }
  button {
    padding: 12px 18px; border: none; border-radius: 20px; cursor: pointer;
    background: linear-gradient(160deg, var(--primary-soft), var(--primary-deep));
    color: var(--on-primary); font-weight: 800;
    touch-action: manipulation;          /* chạm hai lần không phóng to trang */
    -webkit-tap-highlight-color: transparent;
  }
  button:disabled { opacity: .5; cursor: default; }
  .send { width: 46px; height: 46px; flex-shrink: 0; border-radius: 50%; padding: 0; font-size: 17px; }

  /* Màn hình rộng: bó lại giữa cho khỏi trải dài cả màn desktop. */
  @media (min-width: 720px) {
    .head, .feed, .compose { padding-left: max(18px, calc(50% - 420px)); padding-right: max(18px, calc(50% - 420px)); }
    .bubble { max-width: 74%; }
  }
</style>
</head>
<body>
  <div class="head">
    <div class="ava" id="ava">★</div>
    <div class="who">
      <div class="name" id="alice-name">Alice</div>
      <div class="sub" id="alice-sub">đang kết nối…</div>
    </div>
  </div>

  <div id="gate-view" class="gate" hidden>
    <div class="card">
      <h2 id="gate-title">Đăng nhập</h2>
      <div class="lead" id="gate-lead"></div>
      <input id="lg-user" type="text" placeholder="Tên đăng nhập" autocomplete="username" autocapitalize="none" autocorrect="off">
      <input id="lg-pass" type="password" placeholder="Mật khẩu" autocomplete="current-password">
      <input id="lg-code" class="code-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="12" placeholder="Mã truy cập" autocomplete="one-time-code" hidden>
      <div class="err" id="gate-err"></div>
      <button id="gate-btn">Vào chat</button>
    </div>
  </div>

  <div id="chat-view" class="feed" hidden></div>

  <div id="compose" class="compose" hidden>
    <textarea id="msg" rows="1" placeholder="Nhắn cho Alice…" enterkeyhint="send" autocomplete="off" autocapitalize="sentences"></textarea>
    <button class="send" id="send" title="Gửi">➤</button>
  </div>

<script>
/* Mode do máy chủ chèn lúc phục vụ:
     anyone  — ai có link/QR đều chat được, không hỏi gì;
     code    — hỏi một mã truy cập dùng chung;
     account — hỏi username + password.                                        */
const MODE = '__MODE__';
const API = '';
let token = localStorage.getItem('alice-token') || null;
let myName = null;

const $ = (id) => document.getElementById(id);
const auth = () => (token ? { Authorization: 'Bearer ' + token } : {});

async function init() {
  try {
    const r = await fetch(API + '/v1/who');
    const d = await r.json();
    $('alice-name').textContent = d.name || 'Alice';
    document.title = 'Chat với ' + ($('alice-name').textContent);
    if (d.avatar) { $('ava').innerHTML = '<img alt="">'; $('ava').firstChild.src = d.avatar; }
  } catch { /* máy chủ vẫn chạy, chỉ chưa lấy được tên */ }

  // Phiên cũ còn sống thì giữ NGUYÊN tên cũ — mỗi lần F5 mà đổi tên thì lịch sử
  // chat thành ra một đám người lạ trong khi vẫn chỉ là một người.
  if (token) {
    try {
      const r = await fetch(API + '/v1/check', { headers: auth() });
      if (r.ok) { myName = (await r.json()).name || null; enterChat(); return; }
    } catch { /* mất mạng — rơi xuống nhánh vào cửa lại */ }
    token = null;
    myName = null;
    localStorage.removeItem('alice-token');
  }

  // Không có cửa: vẫn xin một phiên để có TÊN riêng (anonymous-xxxxx).
  if (MODE === 'anyone') {
    try {
      const r = await fetch(API + '/v1/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}',
      });
      if (r.ok) {
        const d = await r.json();
        token = d.token;
        myName = d.name;
        localStorage.setItem('alice-token', token);
      }
    } catch { /* không xin được tên thì vẫn chat được, chỉ là vô danh */ }
    enterChat();
    return;
  }
  showGate();
}

function showGate() {
  const byCode = MODE === 'code';
  $('alice-sub').textContent = byCode ? 'cần mã truy cập' : 'cần đăng nhập';
  $('gate-title').textContent = byCode ? 'Nhập mã truy cập' : 'Đăng nhập';
  $('gate-lead').textContent = byCode
    ? 'Người chia sẻ Alice này cho bạn sẽ đưa bạn một mã.'
    : 'Dùng tên đăng nhập và mật khẩu mà chủ Alice đã tạo cho bạn.';
  $('lg-user').hidden = byCode;
  $('lg-pass').hidden = byCode;
  $('lg-code').hidden = !byCode;
  $('gate-view').hidden = false;

  $('gate-btn').onclick = enter;
  for (const el of ['lg-user', 'lg-pass', 'lg-code']) {
    $(el).addEventListener('keydown', (e) => { if (e.key === 'Enter') enter(); });
  }
  // KHÔNG tự focus trên điện thoại: bàn phím bật lên che mất nửa màn hình ngay
  // khi vừa mở, người dùng chưa kịp đọc là mình đang ở đâu.
  if (!('ontouchstart' in window)) $(byCode ? 'lg-code' : 'lg-user').focus();
}

async function enter() {
  $('gate-err').textContent = '';
  $('gate-btn').disabled = true;
  try {
    const body = MODE === 'code'
      ? { code: $('lg-code').value.trim() }
      : { username: $('lg-user').value.trim(), password: $('lg-pass').value };
    const r = await fetch(API + '/v1/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { $('gate-err').textContent = d.error || 'Không vào được.'; return; }
    token = d.token;
    myName = d.name || null;
    localStorage.setItem('alice-token', token);
    $('gate-view').hidden = true;
    enterChat();
  } catch {
    $('gate-err').textContent = 'Không kết nối được máy chủ.';
  } finally {
    $('gate-btn').disabled = false;
  }
}

async function enterChat() {
  $('gate-view').hidden = true;
  $('chat-view').hidden = false;
  $('compose').hidden = false;
  $('alice-sub').textContent = myName ? `bạn đang là ${myName}` : 'Alice nhớ cuộc trò chuyện này';

  // Lịch sử THẬT của Alice, không phải một câu chào viết cứng trong mã: người vào
  // sau đọc được cuộc trò chuyện đang diễn ra, và F5 không mất gì.
  let messages = [];
  try {
    const r = await fetch(API + '/v1/history?limit=60', { headers: auth() });
    if (r.ok) messages = (await r.json()).messages || [];
  } catch { /* không đọc được thì mở màn hình trống, vẫn chat được */ }

  if (!messages.length) {
    addMsg({ role: 'alice', text: 'Chào bạn, mình có thể giúp gì?' });
  } else {
    for (const m of messages) addMsg(m);
  }
}

/**
 * @param {object} m  { role: 'human'|'alice', text, who }
 * `who` là tên người gửi. Tin của CHÍNH mình nằm bên phải và không cần đề tên.
 */
function addMsg(m, isErr) {
  const mine = m.role === 'human' && (!m.who || m.who === myName);
  const other = m.role === 'human' && !mine;

  const row = document.createElement('div');
  row.className = 'row' + (mine ? ' mine' : '') + (other ? ' other' : '');
  if (other && m.who) {
    const a = document.createElement('div');
    a.className = 'author';
    a.textContent = m.who;                   // textContent: tên do máy chủ cấp,
    row.appendChild(a);                      // nhưng vẫn không nhét thẳng vào HTML
  }
  const b = document.createElement('div');
  b.className = 'bubble' + (isErr ? ' err' : '');
  b.textContent = m.text;                    // textContent: câu trả lời của model
  row.appendChild(b);                        // là nội dung không đáng tin
  $('chat-view').appendChild(row);
  scrollDown();
  return b;
}

function scrollDown() {
  $('chat-view').scrollTop = $('chat-view').scrollHeight;
}

const msg = $('msg');
function autoGrow() {
  msg.style.height = 'auto';
  msg.style.height = Math.min(msg.scrollHeight, 120) + 'px';
}
msg.addEventListener('input', autoGrow);

let busy = false;
async function send() {
  const text = msg.value.trim();
  if (!text || busy) return;
  msg.value = '';
  autoGrow();
  addMsg({ role: 'human', text, who: myName });
  busy = true;
  $('send').disabled = true;

  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.textContent = 'Alice đang trả lời…';
  $('chat-view').appendChild(typing);
  scrollDown();

  try {
    const r = await fetch(API + '/v1/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...auth() },
      body: JSON.stringify({ message: text }),
    });
    const d = await r.json().catch(() => ({}));
    typing.remove();
    if (!r.ok) {
      addMsg({ role: 'alice', text: d.error || 'Có lỗi không rõ.' }, true);
      if (r.status === 401) {
        token = null;
        myName = null;
        localStorage.removeItem('alice-token');
        $('chat-view').hidden = true;
        $('compose').hidden = true;
        showGate();
      }
      return;
    }
    addMsg({ role: 'alice', text: d.text });
  } catch {
    typing.remove();
    addMsg({ role: 'alice', text: 'Không kết nối được máy chủ.' }, true);
  } finally {
    busy = false;
    $('send').disabled = false;
  }
}

$('send').onclick = send;
msg.addEventListener('keydown', (e) => {
  // Máy tính: Enter gửi, Shift+Enter xuống dòng. Điện thoại: nút "gửi" trên bàn
  // phím cũng bắn Enter, nên cùng một luật.
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

/*
 * Dán khung app vào ĐÚNG vùng đang nhìn thấy khi bàn phím mở ra.
 *
 * Chỉ đặt chiều cao là chưa đủ, và đó là lỗi của bản trước: iOS không thu trang
 * lại mà cuộn khung nhìn thị giác xuống dưới, nên một body cao bằng
 * `visualViewport.height` vẫn nằm ở đỉnh TRANG — ô nhập trồi lên gần header, cách
 * bàn phím một khoảng lớn. `offsetTop` là phần bị bỏ sót; dịch theo nó thì đáy
 * khung nằm sát mép trên bàn phím.
 */
const vv = window.visualViewport;
if (vv) {
  const fit = () => {
    document.documentElement.style.setProperty('--vh', vv.height + 'px');
    document.body.style.transform = `translateY(${vv.offsetTop}px)`;
  };
  vv.addEventListener('resize', () => { fit(); scrollDown(); });
  vv.addEventListener('scroll', fit);
  fit();
}
// Bàn phím bung ra sau khi focus một nhịp — cuộn lại để tin cuối không bị che.
msg.addEventListener('focus', () => setTimeout(scrollDown, 300));

init();
</script>
</body>
</html>
