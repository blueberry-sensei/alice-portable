appId: digital.kyanon.alice.portable
productName: Alice
copyright: Alice — bản portable

directories:
  output: dist
  buildResources: build

# `asar: true` gói mã app thành một file — khởi động nhanh hơn và không để lộ nguồn
# thành một cây file rời. `runtime/` PHẢI nằm ngoài asar: python nhúng và binary
# opencode là tiến trình con, mà không ai spawn được một file nằm trong asar.
asar: true

files:
  - src/**/*
  - knowledge/**/*
  - package.json
  - '!**/*.map'
  - '!test/**/*'
  - '!scripts/**/*'
  - '!dream-src/**/*'

extraResources:
  - from: runtime
    to: runtime
    filter:
      - '**/*'
      # Rác của lần cài trước: bytecode Linux docker cp mang sang, cache pip, và
      # test của thư viện. Không cái nào chạy trên máy người dùng.
      - '!**/__pycache__/**'
      - '!**/*.pyc'
      - '!**/pip/**'
      - '!**/tests/**'
      - '!**/test/**'

win:
  # Hai target, hai đối tượng:
  #
  #   `nsis` — bộ cài `Alice-Setup-<ver>.exe` cho người dùng cuối. Người không rành
  #     kỹ thuật không nên phải "giải nén thư mục rồi tìm file exe"; họ cần một file
  #     bấm đúp, bấm Next, xong.
  #   `dir`  — thư mục mang đi được, cho ai muốn cắm USB hoặc không có quyền cài.
  #
  # Cố ý KHÔNG dùng target `portable` (một .exe tự giải nén): brain nhúng gần 900MB,
  # mỗi lần chạy là một lần bung hơn 1GB ra %TEMP%.
  target:
    - nsis
    - dir
  artifactName: ${productName}-Setup-${version}.${ext}

mac:
  # `.dmg` KHÔNG cross-build từ Windows — phải dựng trên macOS. Đó là lý do có CI.
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Chưa mua chứng chỉ Apple. Đặt `null` để electron-builder bỏ qua bước ký thay vì
  # dựng dở rồi chết; đổi lại người dùng phải chuột phải → Open ở lần mở đầu.
  identity: null

linux:
  # AppImage: một file, chmod +x là chạy, không cần quyền root và không phụ thuộc
  # bản phân phối — hợp nhất cho "tải về là dùng".
  target:
    - AppImage
  category: Utility
  artifactName: ${productName}-${version}-${arch}.${ext}
  synopsis: Alice — trợ lý chạy trên máy của bạn

nsis:
  # `oneClick: false` + cho chọn thư mục cài — `D-0054` mục 1: installer hỏi nơi cài,
  # có sẵn mặc định, không cài chui vào một chỗ cố định.
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false          # cài cho user hiện tại → không cần quyền Administrator
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false   # gỡ app KHÔNG xoá lịch sử chat của người dùng
  # Script tuỳ chỉnh: giữ `alice-data` khi cài đè / gỡ — uninstaller mặc định xoá
  # sạch $INSTDIR, và dữ liệu của app nằm NGAY trong đó.
  include: build/installer.nsh
  installerLanguages:
    - vi_VN
    - en_US

# Nén `maximum`: bộ cài là thứ KHÁCH TẢI VỀ, nên đổi thời gian build (của mình, một
# lần) lấy dung lượng tải (của khách, mỗi người một lần). Cũng là điều kiện để lọt
# giới hạn 2GB/file của GitHub Release.
compression: maximum

publish: null
