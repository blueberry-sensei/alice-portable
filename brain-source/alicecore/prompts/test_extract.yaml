                },
                {
                  "type": "location",
                  "name": "Ulm, Germany",
                  "description": "Birthplace of Albert Einstein, located in Germany."
                }
              ],
              "is_valid": true
            },
            {
              "title": "Albert Einstein – developed – the theory of relativity",
              "relation": "developed",
              "summary": "Einstein developed the theory of relativity, which later completely revolutionized physics.",
              "content": "He developed the theory of relativity, which revolutionized physics.",
              "category": "Science",
              "keywords": ["Albert Einstein", "theory of relativity", "physics"],
              "priority": "HIGH",
              "status": "COMPLETED",
              "references": [2],
              "entities": [
                {
                  "type": "person",
                  "name": "Albert Einstein",
                  "description": "The person who developed the theory of relativity."
                },
                {
                  "type": "subject",
                  "name": "the theory of relativity",
                  "description": "The physical theory proposed by Einstein."
                }
              ],
              "is_valid": true
            },
            {
              "title": "the theory of relativity – revolutionized – physics",
              "relation": "revolutionized",
              "summary": "The theory of relativity fundamentally changed the field of physics.",
              "content": "The theory of relativity revolutionized physics.",
              "category": "Science",
              "keywords": ["theory of relativity", "physics", "revolutionized"],
              "priority": "MEDIUM",
              "status": "COMPLETED",
              "references": [2],
              "entities": [
                {
                  "type": "subject",
                  "name": "the theory of relativity",
                  "description": "The theory that caused a revolution in physics."
                },
                {
                  "type": "subject",
                  "name": "physics",
                  "description": "The field profoundly transformed by relativity."
                }
              ],
              "is_valid": true
            },
            {
              "title": "Albert Einstein – worked at – the Institute for Advanced Study",
              "relation": "worked at",
              "summary": "Einstein worked at the Institute for Advanced Study in Princeton.",
              "content": "Einstein worked at the Institute for Advanced Study in Princeton.",
              "category": "Career",
              "keywords": ["Albert Einstein", "Institute for Advanced Study", "Princeton"],
              "priority": "MEDIUM",
              "status": "COMPLETED",
              "references": [3],
              "entities": [
